name: Build and Push Docker Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: health_migration_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d health_migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MIGRATION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/health_migration_test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: dashboard

      - name: Run lint
        run: pnpm lint
        working-directory: dashboard

      - name: Run Python ingestion tests
        run: python -m unittest discover -s tests -v

      - name: Run dashboard tests
        run: pnpm turbo run test
        working-directory: dashboard

      - name: Build production bundles
        run: pnpm build
        working-directory: dashboard

      - name: Enforce client bundle budgets
        run: pnpm --filter @health-dashboard/client bundle:check
        working-directory: dashboard

      - name: Install Chromium
        run: pnpm --filter @health-dashboard/client exec playwright install --with-deps chromium
        working-directory: dashboard

      - name: Run production-bundle browser smoke tests
        id: browser_smoke
        run: pnpm --filter @health-dashboard/client e2e:smoke
        working-directory: dashboard

      - name: Upload browser failure diagnostics
        if: ${{ failure() && steps.browser_smoke.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dashboard/packages/client/playwright-report/
            dashboard/packages/client/test-results/
          if-no-files-found: error
          retention-days: 7

  build-and-push:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      # The image has no .git, so the build cannot discover its own commit.
      # Capture it here, where the workflow context knows, and hand it to
      # the build as args. A single UTC timestamp is generated once so the
      # client bundle and the server agree on when the build happened.
      - name: Resolve build identity
        id: build
        run: |
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./dashboard
          file: ./dashboard/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.build.outputs.time }}
            BUILD_NUMBER=${{ github.run_number }}
